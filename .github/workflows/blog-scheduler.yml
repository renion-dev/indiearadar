name: Blog Scheduler

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run blog generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/blog_generator.py

      - name: Generate tag pages
        run: |
          python scripts/generate_tags.py

      - name: Commit and push if changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AI Curator"
          git config user.email "bot@indiearadar.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add _posts/ assets/images/og/ tag/ _layouts/tag.html
          if git diff --staged --quiet; then
            echo "✅ No new posts to commit"
          else
            git commit -m "🤖 New blog post and updated tag pages [$(date +'%Y-%m-%d %H:%M')]"
            git push origin main
            echo "✅ Committed and pushed new post"
          fi
          