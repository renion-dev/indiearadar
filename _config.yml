title: "Indie AI Radar"
description: "Curated AI tools for solopreneurs. Updated daily by AI."
url: "https://yourusername.github.io"
baseurl: "/indiearadar"
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
timezone: Europe/Kyiv
collections:
  tools:
    output: true
    permalink: /tool/:name/
defaults:
  - scope: {path: "", type: "tools"}
    values: {layout: "tool"}
  - scope: {path: "", type: "posts"}
    values: {layout: "post"}
  - scope: {path: ""}
    values: {layout: "default"}
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - scripts/
  - venv/
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
